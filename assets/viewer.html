<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Journal</title>
<style>
:root{
  --paper:#F7F4EE; --panel:#EDE8DF; --ink:#1F1D1A; --ink2:#3A3631; --muted:#6B655C; --faint:#8F887C;
  --rule:#D9D3C7; --rule2:#C9C2B4; --strong:#1F1D1A; --code:#EDE8DF;
  --link:#2C5577; --live:#2C5577; --livedot:#8FA6BC; --wait:#8A5A00; --waitbg:#F2E4C4;
  --decision:#8A4B2A; --plan:#4E6B2B; --stale:#A2461F; --ok:#3D6B35;
  --okbg:#E3EBDD; --stalebg:#F4DFD3; --livebg:#DFE7EF;
  --serif:"Charter","Bitstream Charter","Sitka Text","Iowan Old Style",Cambria,Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
}
:root[data-theme="dark"]{
  --paper:#1C1B19; --panel:#262420; --ink:#EDE7DB; --ink2:#D6CFC2; --muted:#A39C90; --faint:#8A8377;
  --rule:#3A3731; --rule2:#4A463F; --strong:#EDE7DB; --code:#2C2A25;
  --link:#9DB8D6; --live:#9DB8D6; --livedot:#9DB8D6; --wait:#E8B85A; --waitbg:#3A3020;
  --decision:#D99A73; --plan:#A9C27F; --stale:#E58B5E; --ok:#8FC283;
  --okbg:#24301F; --stalebg:#3A2419; --livebg:#1F2A35;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C1B19; --panel:#262420; --ink:#EDE7DB; --ink2:#D6CFC2; --muted:#A39C90; --faint:#8A8377;
    --rule:#3A3731; --rule2:#4A463F; --strong:#EDE7DB; --code:#2C2A25;
    --link:#9DB8D6; --live:#9DB8D6; --livedot:#9DB8D6; --wait:#E8B85A; --waitbg:#3A3020;
    --decision:#D99A73; --plan:#A9C27F; --stale:#E58B5E; --ok:#8FC283;
    --okbg:#24301F; --stalebg:#3A2419; --livebg:#1F2A35;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--link);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
code,pre{font-family:var(--mono)}
.layout{display:flex;min-height:100vh}

/* rail */
.rail{width:264px;flex-shrink:0;border-right:1px solid var(--rule);padding:28px 14px 20px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{font:700 18px/1.2 var(--serif);margin:0;padding:0 10px}
.proj{font:11px var(--mono);color:var(--muted);margin-top:3px;padding:0 10px}
.rail nav{margin-top:22px;flex:1;display:flex;flex-direction:column;gap:2px}
.rlink{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.rlink:hover{background:var(--panel)}
.rlink.top .t{font:500 13px var(--sans);color:var(--muted)}
.rlink.top+.rlink:not(.top){margin-top:10px}
.rlink .t{font:14.5px/1.35 var(--serif)}
.rlink .m{font:11.5px/1.4 var(--sans);color:var(--faint);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rlink.sel{background:var(--panel)}
.rlink.sel .t{font-weight:700;color:var(--ink)}
.rail h4{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:20px 10px 6px}
.rwork{display:flex;gap:8px;text-decoration:none;color:var(--ink2);padding:5px 10px;border-radius:8px;font:13px/1.4 var(--sans)}
.rwork:hover{background:var(--panel)}
.rwork .id{font:10.5px var(--mono);color:var(--faint);padding-top:2px;flex:none}
.rwork.sel{background:var(--panel);color:var(--ink);font-weight:600}
.rwork.child{padding-left:26px;font-size:12.5px}
/* board: git-log style, colours derived from each session's id (as GitLoom derives node colour from content) */
.board{max-width:880px}
.gitline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:12px var(--sans);color:var(--muted);margin:0 0 18px}
.gitline .ref{font:11.5px var(--mono);color:var(--ink2);background:var(--panel);border-radius:6px;padding:2px 8px}
.hash{font:11px var(--mono);color:var(--faint)}
.gitline .hash{color:var(--link)}
.lede{font:16px/1.5 var(--serif);color:var(--ink2);margin:0 0 14px;max-width:62ch}
.av{--h:210;display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border-radius:50%;font:600 10px/1 var(--sans);letter-spacing:.02em;background:hsl(var(--h) 38% 88%);color:hsl(var(--h) 45% 30%)}
.av.sm{width:18px;height:18px;font-size:8.5px}
.av.all{background:var(--panel);color:var(--muted)}
:root[data-theme="dark"] .av{background:hsl(var(--h) 26% 24%);color:hsl(var(--h) 55% 78%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 26% 24%);color:hsl(var(--h) 55% 78%)}}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:18px 0 28px}
.pin{border:1px solid var(--rule);border-left:3px solid var(--wait);border-radius:10px;padding:14px 16px;background:var(--paper)}
.pin .k{display:flex;gap:6px;align-items:center;font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--wait);margin-bottom:6px}
.pin h3{font:600 15.5px/1.35 var(--serif);margin:0 0 4px}
.pin .md{font-size:13.5px;color:var(--ink2)}
.pin .md p:last-child{margin-bottom:0}
.pin .by{display:flex;gap:8px;align-items:center;font:12px var(--sans);color:var(--muted);margin-top:10px}
.glog{position:relative;margin-top:14px}
.thread{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:14px;position:relative;padding-bottom:22px}
.thread::before{content:"";position:absolute;left:13.5px;top:30px;bottom:0;width:1px;background:var(--rule2)}
.thread:last-child::before{display:none}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font:12.5px var(--sans);color:var(--muted);min-height:24px}
.tmeta b{color:var(--ink);font-weight:600}
.tmeta .to{display:inline-flex;gap:6px;align-items:center}
.tmeta .wid{font:11px var(--mono);color:var(--link);background:var(--livebg);border-radius:4px;padding:1px 5px;text-decoration:none}
.thread h3{font:600 17px/1.35 var(--serif);margin:4px 0 4px}
.thread .md{font-size:14px;color:var(--ink2)}
.thread .md p:last-child{margin-bottom:0}
.replies{margin-top:12px;display:grid;gap:10px;border-left:2px solid var(--rule);padding-left:16px}
.reply .tmeta{font-size:12px}
.reply p.t{margin:2px 0 0;font:14px/1.5 var(--sans);color:var(--ink)}
.reply .md{font-size:13.5px}
.tmeta .chip{margin-left:0}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.files a{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:8px;padding:5px 10px;font:12.5px var(--mono);color:var(--ink2);text-decoration:none}
.files a:hover{border-color:var(--rule2);color:var(--ink)}
.files a span{font:11.5px var(--sans);color:var(--faint)}
.gstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px;margin:0 0 22px}
.gstat .box{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--paper);min-width:0}
.gstat .box .label{display:block;margin-bottom:6px}
.gstat ul{list-style:none;margin:0;padding:0;font:13px/1.5 var(--sans)}
.gstat li{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;padding:3px 0;border-top:1px dashed var(--rule)}
.gstat li:first-child{border-top:0}
.gstat .v{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.compose{border:1px solid var(--rule);border-radius:12px;padding:14px;margin:0 0 22px;background:var(--paper)}
.compose .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.compose textarea{width:100%;box-sizing:border-box;min-height:64px;font:14px/1.45 var(--sans);padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.compose input,.compose select{flex:1 1 140px;font:13px var(--sans);padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.compose button{font:600 13px var(--sans);padding:7px 12px;border-radius:8px;border:1px solid var(--link);background:var(--link);color:var(--bg);cursor:pointer}
.compose pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0;font-size:12px}
.sgoal{border:1px solid var(--rule);border-left:3px solid var(--link);border-radius:12px;padding:16px 20px;margin:18px 0 24px;background:var(--paper)}
.sgoal .k{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--link)}
.sgoal .k .chip{margin-left:0}
.sgoal .md{font:15.5px/1.55 var(--serif);color:var(--ink);margin-top:8px}
.sgoal .md p:last-child{margin-bottom:0}
.sgoal .f{font:12px var(--sans);color:var(--muted);margin-top:10px}
.lanes{margin-top:14px;display:grid;gap:6px}
.lanes .label{margin-bottom:2px}
.lanes .empty{margin:0;font-size:13px}
.lane{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font:13px var(--sans);color:var(--muted)}
.lane b{color:var(--ink);font-weight:600}
.lane .sc{flex-basis:100%;padding-left:28px;font-size:12.5px;color:var(--faint)}
.sgoal.dirs{border-left-color:var(--decision)}.sgoal.dirs .k{color:var(--decision)}
.sgoal.dirs ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.sgoal.dirs li .md{font:14.5px/1.5 var(--sans);margin:0}
.sgoal.dirs li .f{margin:0 0 0 8px;font:11px var(--mono)}
.sgoal.met{border-left-color:var(--ok)}.sgoal.met .k{color:var(--ok)}
.rcpt{font:12px var(--sans);color:var(--faint);margin-top:6px}
.board .empty-how{border:1px dashed var(--rule2);border-radius:10px;padding:18px 20px;color:var(--muted);font-size:14px}
.board .empty-how pre{margin:10px 0 0;font-size:12.5px;color:var(--ink2);white-space:pre-wrap}
.rlink .t .n{font:500 11px var(--sans);color:var(--faint);margin-left:6px}
.railfoot{font:12px var(--sans);color:var(--muted);margin-top:20px;display:grid;gap:8px;padding:0 10px}
.railfoot button{text-align:left;color:var(--muted)}
.railfoot button:hover{color:var(--ink)}
.status{font:11.5px var(--sans);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status.working{color:var(--live)}
.status.working::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--livedot);animation:breathe 2.4s ease-in-out infinite}
.status.waiting{color:var(--wait);font-weight:600}
.status.waiting::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--wait)}
.status.finished,.status.quiet{color:var(--muted)}
.status.quiet::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--faint)}
.status.pill{font-size:12.5px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--panel)}
.status.pill.waiting{background:var(--waitbg)}
.status.pill.waiting::before{box-shadow:0 0 0 3px color-mix(in srgb,var(--wait) 22%,transparent)}
.status.pill.working{background:var(--livebg)}
.status.pill.finished{background:var(--okbg);color:var(--ok)}
.status.pill.finished::before{content:"✓"}
@keyframes breathe{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status.working::before,.inprog::before,.chip.t-live::before{animation:none}}
.mobilebar{display:none}

/* main */
main{flex:1;min-width:0;padding:40px 56px 96px}
.col{max-width:860px}
.kick{font:12.5px var(--sans);color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.label{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
code{font-size:.86em;background:var(--code);padding:.1em .4em;border-radius:4px;overflow-wrap:anywhere}
.md pre code{background:none;padding:0;font-size:inherit}

/* overview */
.top{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--muted);gap:16px}
.top span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.masthead{font:600 34px/1.1 var(--serif);letter-spacing:-.015em;margin:14px 0 12px}
.dateline{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:12.5px var(--sans);color:var(--muted);border-top:1px solid var(--rule);padding:10px 0 0}
.lead{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;padding:22px 24px;margin-top:20px;background:var(--panel);border-radius:14px}
.lead h2{font:600 24px/1.25 var(--serif);letter-spacing:-.01em;margin:8px 0 10px}
.lead h2 a,.story h3 a{color:inherit;text-decoration:none}
.lead h2 a:hover,.story h3 a:hover{text-decoration:underline}
.lead p.dek{font:17px/1.55 var(--serif);margin:0 0 16px}
.waitbox{background:var(--waitbg);padding:12px 14px;margin:0 0 16px;border-radius:10px}
.waitbox .label{color:var(--wait)}
.waitbox p{margin:2px 0 0;font:15.5px/1.5 var(--serif)}
.meta{font:12.5px var(--sans);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.meta a{font-weight:500}
.lists .label{display:block;margin:0 0 6px}
.lists ul{margin:0 0 18px;padding:0;list-style:none}
.lists li{margin:0 0 6px;line-height:1.5;padding-left:20px;position:relative;color:var(--ink2)}
.lists li::before{content:"";position:absolute;left:2px;top:.45em;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint);box-sizing:border-box}
.lists ul.done li::before{content:"✓";border:0;border-radius:0;width:auto;height:auto;top:0;left:1px;color:var(--ok);font-weight:600}
.stories{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.story{padding:18px 20px;border:1px solid var(--rule);border-radius:12px}
.story h3{font:600 17px/1.3 var(--serif);margin:6px 0}
.story p{margin:0 0 12px;font-size:14px;line-height:1.55;color:var(--ink2)}

/* index */
.index{margin-top:44px}
.secthead{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule2);padding-bottom:10px;margin-bottom:2px;flex-wrap:wrap}
.secthead .label{color:var(--ink);font-size:11px}
.secthead .n{font:12.5px var(--sans);color:var(--muted)}
.secthead .toggle{margin-left:auto;display:flex;gap:2px;background:var(--panel);border-radius:8px;padding:3px}
.secthead .toggle button{font:12px var(--sans);color:var(--muted);padding:3px 10px;border-radius:6px}
.secthead .toggle button.on{color:var(--ink);background:var(--rule);font-weight:500}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.wrow .ttl{font:15px/1.4 var(--serif)}
.wrow .ttl a{color:inherit;text-decoration:none}
.wrow .ttl a:hover{text-decoration:underline}
.wrow .ttl .id{font:10.5px var(--mono);color:var(--faint);margin-right:8px}
.wrow .sub{font:12.5px/1.5 var(--sans);color:var(--muted);margin-top:2px}
.wrow .facts{font:12px var(--sans);color:var(--muted);text-align:right;white-space:nowrap}
.wrow.d1{padding-left:22px}.wrow.d2{padding-left:44px}.wrow.d3{padding-left:66px}
.wrow.d1 .ttl,.wrow.d2 .ttl,.wrow.d3 .ttl{font-size:14px}
.type{font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-left:8px;white-space:nowrap}
.stale{color:var(--stale);font-weight:600}
.typegroup{margin-top:20px}
.typegroup .label{display:block;margin-bottom:2px}

/* session */
h1.title{font:600 30px/1.2 var(--serif);letter-spacing:-.01em;margin:10px 0 12px}
.workline{font:13px var(--sans);color:var(--muted);margin:0 0 26px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.workline a{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:4px 10px;text-decoration:none;color:var(--ink2)}
.workline a:hover{border-color:var(--rule2);color:var(--ink)}
.workline .id{font:11px var(--mono);color:var(--link);background:var(--livebg);border-radius:4px;padding:1px 5px}
.req{margin:0 0 24px}
.req .label{display:block;margin-bottom:8px}
.req .q{margin:0;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;font:italic 16px/1.6 var(--serif);color:var(--ink2);overflow-wrap:anywhere}
.ret{display:flex;gap:14px;padding:14px 16px;border:1px solid var(--rule);border-radius:12px}
.ret .ic{flex:none;width:32px;height:32px;border-radius:8px;background:var(--okbg);color:var(--ok);display:grid;place-items:center}
.ret.bad .ic{background:var(--stalebg);color:var(--stale)}
.ret .k{font:12px var(--sans);color:var(--muted)}
.ret .k .chip{margin-left:4px}
.ret .nm{font:600 16.5px/1.35 var(--serif);margin:2px 0 6px}
.brief{background:var(--panel);border-radius:14px;padding:20px 24px 22px;margin-bottom:40px}
.brief .head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.brief .head .label{color:var(--ink)}
.brief .head span:last-child{font:12px var(--sans);color:var(--muted)}
.brief .now{font:17.5px/1.55 var(--serif);margin:12px 0 16px}
.pbar{display:flex;gap:3px;height:6px;margin:0 0 18px}
.pbar i{border-radius:3px;background:var(--rule2)}
.pbar i.d{background:var(--ok)}
.brief .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.brief .wait{display:flex;gap:12px;align-items:flex-start;background:var(--waitbg);border-radius:10px;padding:12px 16px;margin-top:2px;color:var(--wait)}
.brief .wait svg{flex:none;margin-top:3px}
.brief .wait .label{color:var(--wait)}
.brief .wait p{font:16px/1.5 var(--serif);margin:2px 0;color:var(--ink)}
.brief .wait small{font:12px var(--sans);color:var(--muted)}
.brief .sum{border-top:1px solid var(--rule2);margin-top:14px;padding-top:14px}
.brief .sum .label{color:var(--ink)}
.recordhead{display:flex;align-items:baseline;gap:8px}
.recordhead .label{color:var(--ink);font-size:11px}
.recordhead .n{font:12.5px var(--sans);color:var(--muted)}
.tabs{display:flex;gap:2px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;padding:3px;background:var(--panel);border-radius:9px;font:12.5px var(--sans);width:fit-content;max-width:100%}
.tabs:empty{display:none}
.tabs button,.tabs a{color:var(--muted);padding:4px 10px;border-radius:6px;text-decoration:none}
.tabs button.on,.tabs a.on{color:var(--ink);background:var(--rule);font-weight:500}
.tabs .sep{width:1px;height:16px;background:var(--rule2);margin:0 6px}
.tabs label{color:var(--muted);display:flex;gap:6px;align-items:center;padding-right:6px}
.tabs select{font:12.5px var(--sans);color:var(--ink);background:transparent;border:0;padding:2px 4px}

/* record entries */
.entry{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:1px solid var(--rule)}
.tag{display:inline-block;font:600 11px/1.5 var(--sans);letter-spacing:0;text-transform:none;padding:1px 7px;border-radius:4px;color:var(--muted);background:color-mix(in srgb,currentColor 13%,transparent)}
.tag.k-decision{color:var(--decision)}.tag.k-plan{color:var(--plan)}.tag.k-fact{color:var(--ok)}
.tag.k-blocker,.tag.k-review{color:var(--wait)}.tag.k-output,.tag.k-summary,.tag.k-chapter{color:var(--live)}
.stalef .tag.k-fact{color:var(--stale)}
.entry .gut time,.nested .n-gut time{font:12px var(--sans);color:var(--faint);display:block;margin-top:6px}
.entry .body{max-width:720px;min-width:0}
.entry .lede{font-size:14.5px;line-height:1.6;color:var(--ink2)}
.entry .lede b{color:var(--ink);font-weight:600}
.by{font:12px var(--sans);color:var(--faint);margin-top:8px}
.by code,.agentname{font:12px var(--mono);background:none;padding:0;color:var(--ink2)}
.small-id{font:11px var(--mono);color:var(--faint)}
.chose{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--decision);display:block}
.entry h3{font:600 17px/1.35 var(--serif);margin:4px 0 2px}
.entry .prose{font-size:14.5px;line-height:1.65;margin-top:10px}
.aside{border-top:1px dashed var(--rule2);margin-top:14px;padding-top:10px}
.aside p{margin:4px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted)}
.goal{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--plan);margin-right:8px}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:12px 0 0;display:grid;gap:6px}
ol.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;color:var(--ink2)}
ol.steps li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rule2);font:600 11px/17px var(--sans);text-align:center;color:var(--plan);box-sizing:border-box}
.superseded{opacity:.55}
.superseded h3,.superseded .lede b{text-decoration:line-through;text-decoration-thickness:1px}
.trust{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin-left:8px}
.trust.v{color:var(--ok)}.trust.s{color:var(--stale)}.trust.c{color:var(--faint)}

/* chapters */
.chapter .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chapter h3{margin:0;font-size:16.5px}
.chapter .head .agentname{font-size:12px;color:var(--muted)}
.chapter .head button{margin-left:auto;font:12px var(--sans);color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:3px 10px}
.chapter .head button:hover{color:var(--ink);border-color:var(--rule2)}
.chapter .stat{font:12px var(--sans);color:var(--faint);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-top:4px}
.brief-given{margin-top:12px}
.brief-given p{font:italic 14.5px/1.6 var(--serif);color:var(--ink2);margin:2px 0 0}
.nested{grid-column:1 / -1;display:grid;grid-template-columns:104px minmax(0,1fr);gap:0 16px;margin-top:14px}
.nested > .n-item{display:contents}
.nested .n-gut{padding:14px 0}
.nested .n-body{border-left:1px solid var(--rule2);padding:14px 0 14px 20px;min-width:0}
.inprog{font:italic 14.5px var(--serif);color:var(--ink2);display:flex;gap:10px;align-items:center}
.inprog::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--livedot);flex-shrink:0;animation:breathe 2.4s ease-in-out infinite}
.folded .nested,.folded .brief-given{display:none}

/* markdown + collapse */
.md{font-size:14.5px;line-height:1.7}
.md > :first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{font:600 16px/1.35 var(--serif);margin:22px 0 6px}
.md h1{font-size:17px}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 12px;padding-left:20px}
.md li{margin:0 0 4px}
.md li::marker{color:var(--faint)}
.md pre{position:relative;background:var(--code);padding:14px 16px;margin:4px 0 16px;overflow:auto;font-size:12.5px;line-height:1.6;border-radius:8px}
.md pre button{position:absolute;top:8px;right:8px;font:11px var(--sans);color:var(--muted);background:var(--paper);padding:2px 8px;border:1px solid var(--rule2);border-radius:5px;opacity:0;transition:opacity .15s}
.md pre:hover button,.md pre button:focus{opacity:1}
.md blockquote{margin:0 0 12px;padding-left:14px;border-left:2px solid var(--rule2);color:var(--ink2);font-style:italic}
.md a{word-break:break-word}
.collapse{position:relative;max-height:240px;overflow:hidden}
.collapse::after{content:"";position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(to bottom,transparent,var(--paper))}
.brief .collapse::after{background:linear-gradient(to bottom,transparent,var(--panel))}
.more{font:12.5px var(--sans);margin-top:6px;display:flex;gap:8px;align-items:baseline}
.more button{color:var(--link);font-weight:500}
.more span{color:var(--muted)}
.flagged{background:var(--waitbg);color:var(--wait);font:11px var(--sans);padding:1px 5px;border-radius:3px}

/* work page */
.pending li{list-style:none;margin:0 0 8px;display:grid;grid-template-columns:22px 1fr;font-size:14.5px;line-height:1.5}
.pending ul{padding:0;margin:8px 0 0}
.pending .g{font:13px var(--mono);color:var(--faint);padding-top:1px}
.pending .s-open .g{color:var(--wait)}
.pending .s-done .txt,.pending .s-dropped .txt{color:var(--muted);text-decoration:line-through}
.pending small{display:block;font:12px var(--sans);color:var(--muted);margin-top:2px}
.empty{color:var(--muted);font-style:italic}
.emptypage{max-width:560px;margin:14vh auto 0;text-align:center}
.emptypage h2{font:600 26px/1.2 var(--serif);margin:0 0 10px}
.emptypage p{font-size:15px;color:var(--ink2)}
.emptypage pre{display:inline-block;text-align:left;background:var(--code);padding:12px 16px;font-size:12.5px;margin-top:8px;border-radius:8px}

/* components: chips, tiles, progress, cards, md tables / checklists / callouts */
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--sans);letter-spacing:.02em;padding:3px 8px;border-radius:999px;border:1px solid var(--rule2);color:var(--muted);white-space:nowrap;vertical-align:middle;margin-left:6px}
.chip.t-ok{color:var(--ok);background:var(--okbg);border-color:transparent}
.chip.t-bad{color:var(--stale);background:var(--stalebg);border-color:transparent}
.chip.t-live{color:var(--live);background:var(--livebg);border-color:transparent}
.chip.t-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--livedot);animation:breathe 2.4s ease-in-out infinite}
.chip.t-wait{color:var(--wait);background:var(--waitbg);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:20px 0 4px}
.tile{background:var(--panel);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.tile .v{font:600 26px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.tile .k{font:12px/1.35 var(--sans);color:var(--muted);margin-top:4px}
.tile.t-ok .v{color:var(--ok)}.tile.t-bad .v{color:var(--stale)}.tile.t-wait .v{color:var(--wait)}.tile.t-live .v{color:var(--live)}
.bar{height:6px;background:var(--rule);border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.progress{display:flex;align-items:center;gap:10px;font:12px var(--sans);color:var(--muted);margin-top:6px;justify-content:flex-end}
.progress .bar{flex:1;max-width:120px}
.card{border:1px solid var(--rule);border-radius:12px;padding:16px 20px;background:var(--paper)}
.pending.card ul{margin:4px 0 0}
.pending.card li{padding:10px 0;margin:0;border-top:1px solid var(--rule);align-items:start}
.pending.card li:first-child{border-top:0}
.md table{border-collapse:collapse;width:100%;margin:4px 0 16px;font:13px/1.5 var(--sans);display:block;overflow-x:auto}
.md th,.md td{border-bottom:1px solid var(--rule);padding:7px 12px 7px 0;text-align:left;vertical-align:top}
.md th{font-weight:600;color:var(--muted);border-bottom:1px solid var(--rule2)}
.md li.task{list-style:none;margin-left:-20px;display:flex;gap:8px}
.md li.task input{margin-top:.45em;accent-color:var(--ok)}
.md li.task.done > span{color:var(--muted);text-decoration:line-through}
.md .callout{background:var(--panel);border-radius:10px;padding:12px 16px;margin:0 0 14px;font-style:normal;color:var(--ink);border:0}
.md .callout b.ct{display:block;font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--link);margin-bottom:2px}
.md .callout.warning b.ct,.md .callout.caution b.ct{color:var(--stale)}
.md .callout.tip b.ct{color:var(--ok)}
.md .callout.important b.ct{color:var(--wait)}

@media (max-width:1100px){main{padding:32px 32px 80px}.entry,.nested{grid-template-columns:88px minmax(0,1fr)}}
@media (max-width:860px){
  .layout{display:block}
  .rail{display:none}
  .mobilebar{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:5}
  .mobilebar b{font:700 16px var(--serif);white-space:nowrap}
  .mobilebar select{flex:1;min-width:0;font:14px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule2);padding:8px;border-radius:8px}
  main{padding:20px 16px 64px}
  .lead,.stories,.brief .cols{grid-template-columns:1fr}
  .lead{gap:8px;padding:18px 16px}
  .brief{padding:18px 16px}
  .brief .cols{gap:0}
  .entry,.nested{grid-template-columns:1fr;gap:6px}
  .nested .n-gut{padding-bottom:0}
  .nested .n-body{padding-top:6px}
  .wrow{grid-template-columns:1fr}.wrow .facts{text-align:left}.progress{justify-content:flex-start}
  .wrow.d1{padding-left:14px}.wrow.d2{padding-left:28px}.wrow.d3{padding-left:42px}
}

<body>
<div class="mobilebar"><b>Agent Journal</b><select id="msel" aria-label="Go to"></select></div>
<div class="layout">
  <aside class="rail" id="rail" aria-label="Sessions"></aside>
  <main id="main"><div class="emptypage"><p>Opening the journal…</p></div></main>
</div>
<script>
(function(){
"use strict";
var B=null, lastUpdated=-1, lastSeen=0, kind="all", agentF="all", idxMode="area";
var open={}, folded={}, LIVE=30*60;
var ROMAN=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV"];

/* ---------- theme ---------- */
var theme="auto";
try{ theme=localStorage.getItem("aj.theme")||"auto"; }catch(e){}
function applyTheme(){ if(theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",theme); }
applyTheme();

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function nowS(){ return Date.now()/1000; }
function ago(ts){ var d=nowS()-ts; if(d<60) return "just now"; if(d<3600) return Math.floor(d/60)+" min ago"; if(d<86400) return Math.floor(d/3600)+" h ago"; var n=Math.floor(d/86400); return n+(n>1?" days":" day")+" ago"; }
function clock(ts){ var d=new Date(ts*1000); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
function day(ts){ var d=new Date(ts*1000), t=new Date(); var y=new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return "today, "+clock(ts);
  if(d.toDateString()===y.toDateString()) return "yesterday, "+clock(ts);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+", "+clock(ts); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function words(s){ return (s||"").trim().split(/\s+/).filter(Boolean).length; }
function items(s){ return (s||"").split(/\s*(?:;|\n)\s*/).map(function(x){return x.replace(/^[-*•]\s*/,"").trim();}).filter(Boolean); }
function first(s){ var m=(s||"").match(/^(.+?[.!?])(\s|$)/); return m?m[1]:s; }
function stateOf(s){
  if(s.status==="ended") return "finished";
  if(nowS()-s.last>LIVE) return "quiet";
  if(openBlockers(s).length || s.status==="idle") return "waiting";
  return "working"; }
var SLABEL={working:"writing now",waiting:"waiting for you",finished:"finished",quiet:"went quiet"};
function statusHtml(s, pill){ var st=stateOf(s); return '<span class="status '+st+(pill?' pill':'')+'">'+(pill?cap(SLABEL[st]):SLABEL[st])+'</span>'; }
function sname(s){ return s.name || ("Session "+s.id.slice(0,8)); }
function openBlockers(s){ return (s.entries||[]).filter(function(e){return e.kind==="blocker"&&!e.resolved&&!e.supersededBy;}); }
function agentShort(n){ var p=(n||"main").split(":"); return p.length>1?'<span class="agentname">'+esc(p[0])+'</span> <span class="small-id">'+esc(p[1])+'</span>':'<span class="agentname">'+esc(p[0])+'</span>'; }
function rank(s){ return {waiting:0,working:1,quiet:2,finished:3}[stateOf(s)]; }
function sessions(){ return Object.values(B.sessions||{}).sort(function(a,b){ return rank(a)-rank(b) || b.last-a.last; }); }
function flag(html){ return html.replace(/\[flagged: ([^\]]*)\]/g,'<span class="flagged" title="Instruction-like text in a stored note; treated as data">flagged: $1</span>'); }

/* ---------- components ---------- */
function chip(text, tone){ return '<span class="chip'+(tone?" t-"+tone:"")+'">'+esc(text)+'</span>'; }
function tiles(arr){ return '<div class="tiles">'+arr.map(function(t){ return '<'+(t.href?'a href="'+t.href+'"':'div')+' class="tile'+(t.tone&&t.v?" t-"+t.tone:"")+'"><div class="v">'+esc(t.v)+'</div><div class="k">'+esc(t.k)+'</div></'+(t.href?'a':'div')+'>'; }).join("")+'</div>'; }
function progressOf(wid){ var p=((B.index||{})[wid]||{}).pendingItems||[], live=p.filter(function(x){return x.status!=="dropped";}), d=live.filter(function(x){return x.status==="done";}).length; return {done:d, total:live.length}; }
function progressHtml(wid){ var p=progressOf(wid); if(!p.total) return ""; return '<div class="progress"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+p.total+'" aria-valuenow="'+p.done+'"><i style="width:'+Math.round(100*p.done/p.total)+'%"></i></div><span>'+p.done+'/'+p.total+' tasks</span></div>'; }

/* ---------- markdown (small, escapes first) ---------- */
function inline(t){
  var codes=[]; t=t.replace(/`([^`]+)`/g,function(_,c){ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  t=esc(t);
  t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,"$1<i>$2</i>").replace(/(^|\W)_([^_\n]+)_(?!\w)/g,"$1<i>$2</i>");
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/\u0000(\d+)\u0000/g,function(_,i){ return "<code>"+esc(codes[+i])+"</code>"; });
  return flag(t); }
function md(src){
  var L=(src||"").replace(/\r/g,"").split("\n"), out=[], i=0, para=[];
  function flush(){ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } }
  while(i<L.length){
    var l=L[i];
    if(/^```/.test(l)){ flush(); var buf=[]; i++; while(i<L.length && !/^```/.test(L[i])) buf.push(L[i++]); i++;
      out.push('<pre><button type="button" data-copy>Copy</button><code>'+esc(buf.join("\n"))+"</code></pre>"); continue; }
    var h=l.match(/^(#{1,4})\s+(.*)/);
    if(h){ flush(); out.push("<h"+h[1].length+">"+inline(h[2])+"</h"+h[1].length+">"); i++; continue; }
    if(/^\s*[-*]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l)){
      flush(); var ord=/^\s*\d/.test(l), tag=ord?"ol":"ul", li=[];
      while(i<L.length && (ord? /^\s*\d+[.)]\s+/.test(L[i]) : /^\s*[-*]\s+/.test(L[i]))){
        var txt=L[i].replace(/^\s*(?:[-*]|\d+[.)])\s+/,""); i++;
        while(i<L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*(?:[-*]|\d+[.)])\s+/.test(L[i])) txt+=" "+L[i++].trim();
        var tk=txt.match(/^\[([ xX])\]\s+(.*)/);
        li.push(tk? '<li class="task'+(tk[1]===" "?"":" done")+'"><input type="checkbox" disabled'+(tk[1]===" "?"":" checked")+' aria-label="'+(tk[1]===" "?"open":"done")+'"><span>'+inline(tk[2])+"</span></li>" : "<li>"+inline(txt)+"</li>"); }
      out.push("<"+tag+">"+li.join("")+"</"+tag+">"); continue; }
    if(/^>\s?/.test(l)){ flush(); var q=[]; while(i<L.length && /^>\s?/.test(L[i])) q.push(L[i++].replace(/^>\s?/,""));
      var co=q[0].match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/i);
      if(co){ q[0]=co[2]; out.push('<blockquote class="callout '+co[1].toLowerCase()+'"><b class="ct">'+co[1].toLowerCase()+'</b>'+inline(q.join(" ").trim())+"</blockquote>"); continue; }
      out.push("<blockquote>"+inline(q.join(" "))+"</blockquote>"); continue; }
    if(/^\s*\|/.test(l) && i+1<L.length && /^\s*\|?\s*:?-{2,}/.test(L[i+1])){ flush();
      var cells=function(r){ return r.trim().replace(/^\||\|$/g,"").split("|").map(function(c){return inline(c.trim());}); };
      var th=cells(l), rows=[]; i+=2;
      while(i<L.length && /^\s*\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push("<table><thead><tr>"+th.map(function(c){return "<th>"+c+"</th>";}).join("")+"</tr></thead><tbody>"+
        rows.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>";}).join("")+"</tbody></table>"); continue; }
    if(!l.trim()){ flush(); i++; continue; }
    para.push(l.trim()); i++;
  }
  flush(); return out.join(""); }
function longText(id, text, limit){
  var w=words(text);
  if(w<=(limit||170) || open[id]) return '<div class="md">'+md(text)+'</div>'+(w>(limit||170)?'<div class="more"><button type="button" data-open="'+esc(id)+'">Show less</button></div>':"");
  return '<div class="md collapse">'+md(text)+'</div><div class="more"><button type="button" data-open="'+esc(id)+'">Read more</button><span>· '+w+' words</span></div>'; }

/* ---------- brief fallback ---------- */
function brief(s){
  var b=s.brief||{}, tasks=s.tasks||[];
  var done=items(b.done), left=items(b.next);
  if(!done.length) done=tasks.filter(function(t){return t.status==="completed";}).map(function(t){return t.subject;});
  if(!left.length) left=tasks.filter(function(t){return t.status!=="completed";}).map(function(t){return t.subject;});
  var now=b.now || s.statusText || (s.summary? first(s.summary):"") || (s.plan? "Working on: "+s.plan.title : "");
  var ob=openBlockers(s), wait=b.blocked || (ob.length? ob[ob.length-1].title : "");
  return {now:now, done:done, left:left, wait:wait, ts:b.ts||null}; }
/* background-agent returns arrive as the session's prompt in raw <task-notification> XML */
function notif(p){
  if(!/^\s*<task-notification>/.test(p||"")) return null;
  var g=function(t){ var m=p.match(new RegExp("<"+t+">([\\s\\S]*?)(?:</"+t+">|$)")); return m?m[1].trim():""; };
  var sm=g("summary");
  return {name:(sm.match(/"([^"]+)"/)||[])[1]||sm||"Background task", status:g("status")||"returned", result:g("result")}; }
function listHtml(arr, cls){ return arr.length? "<ul"+(cls?' class="'+cls+'"':"")+">"+arr.map(function(x){return "<li>"+inline(x)+"</li>";}).join("")+"</ul>" : '<p class="empty" style="margin:0 0 30px">Nothing listed.</p>'; }
function agentCount(s){ return Object.keys(s.agents||{}).length; }
function workPath(wid){ var w=B.work&&B.work[wid]; if(!w) return ""; var p=[], seen={}; var cur=w; while(cur && !seen[cur.id]){ seen[cur.id]=1; p.unshift(cur.title); cur=cur.parent?B.work[cur.parent]:null; } return p.join(" › "); }

/* ---------- rail ---------- */
function rail(route){
  var h='<p class="brand">Agent Journal</p><div class="proj">'+esc(B.project)+'</div><nav>';
  h+='<a class="rlink top'+(route.v==="all"?" sel":"")+'" href="#/"><div class="t">All sessions</div></a>';
  var nb=(B.msgs||[]).length;
  h+='<a class="rlink top'+(route.v==="board"?" sel":"")+'" href="#/board"><div class="t">Board'+(nb?'<span class="n">'+nb+' message'+(nb===1?"":"s")+'</span>':'')+'</div></a>';
  sessions().forEach(function(s){
    h+='<a class="rlink'+(route.v==="s"&&route.id===s.id?" sel":"")+'" href="#/s/'+encodeURIComponent(s.id)+'"><div class="t">'+esc(sname(s))+'</div><div class="m">'+statusHtml(s)+'<span>'+ago(s.last)+'</span></div></a>';
  });
  var tops=Object.values(B.work||{}).filter(function(w){return !w.parent;}).sort(function(a,b){return (a.status!=="open")-(b.status!=="open")||b.updated-a.updated;});
  if(tops.length){
    h+='<h4>Work</h4>';
    tops.slice(0,12).forEach(function(w){
      h+='<a class="rwork'+(route.v==="w"&&route.id===w.id?" sel":"")+'" href="#/w/'+w.id+'"><span class="id">'+w.id+'</span>'+esc(w.title)+'</a>';
      kids(w.id).slice(0,6).forEach(function(c){ h+='<a class="rwork child'+(route.v==="w"&&route.id===c.id?" sel":"")+'" href="#/w/'+c.id+'">'+esc(c.title)+'</a>'; });
    });
  }
  h+='</nav><div class="railfoot"><button type="button" data-theme-cycle>Theme: '+theme+'</button><span id="upd">Record updated '+ago(B.updated)+'</span></div>';
  document.getElementById("rail").innerHTML=h;

function kids(wid){ return Object.values(B.work||{}).filter(function(w){return w.parent===wid;}).sort(function(a,b){return (a.status!=="open")-(b.status!=="open")||b.updated-a.updated;}); }

/* ---------- overview ---------- */

function wrow(w, depth){

  var liveS=Object.values(B.sessions).filter(function(s){return s.work===w.id && stateOf(s)!=="finished" && stateOf(s)!=="quiet";});
  return '<div class="wrow d'+Math.min(depth,3)+'"><div><div class="ttl"><span class="id">'+w.id+'</span><a href="#/w/'+w.id+'">'+esc(w.title)+'</a><span class="type">'+esc(w.type||"feature")+'</span>'+
    (w.status!=="open"?chip(w.status, w.status==="done"?"ok":""):'')+(liveS.length?chip("live","live"):'')+'</div>'+
    '<div class="sub">'+(b?inline(b)+' · ':'')+'updated '+ago(w.updated)+'</div></div>'+
    '<div class="facts">'+factsLine(w)+progressHtml(w.id)+'</div></div>'; }
function factsLine(w){
  var st=workStats(w.id), parts=[];

function indexSection(){

    (function walk(ws,depth){ ws.forEach(function(w){ h+=wrow(w,depth); walk(kids(w.id),depth+1); }); })(tops,0);
  } else {
    ["theme","feature","optimization","improvement","bug","investigation","refactor","research","chore"].forEach(function(t){

/* ---------- per-work stats from state ---------- */
var statCache={};
function workEntries(wid){ var out=[]; Object.values(B.sessions).forEach(function(s){ (s.entries||[]).forEach(function(e){ if(e.wid===wid) out.push(e); }); }); return out.sort(function(a,b){return a.ts-b.ts;}); }
function workStats(wid){

/* ---------- session ---------- */
function entryTitleBody(e){ var t=e.title||"", b=e.body||""; return {t:t,b:b}; }
function renderEntry(e, nested){
  var kindLabel={plan:"Plan",decision:"Decision",note:"Note",status:"Status",fact:"Fact",review:"Review",blocker:"Blocker",summary:"Summary",output:"Returned",brief:"Brief update"}[e.kind]||cap(e.kind);

      (tb.b?'<div class="prose md">'+md(tb.b)+'</div>':'')+

function chapter(a, n, ents){

function session(s){

  if(b.wait) h+='<div class="wait"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><span class="label">Waiting on you</span><p>'+inline(b.wait)+'</p><small>Answer in the terminal running this session.</small></div></div>';

  h+='<div class="tabs">'+tabs.map(function(t){return '<button type="button" data-kind="'+t[0]+'" class="'+(kind===t[0]?"on":"")+'">'+t[1]+(t[0]!=="all"?' '+t[2]:'')+'</button>';}).join("")+
     '<span class="sep" aria-hidden="true"></span><label>by <select data-agent>'+agentNames.map(function(n){return '<option value="'+esc(n)+'"'+(agentF===n?" selected":"")+'>'+(n==="all"?"any agent":esc(n))+'</option>';}).join("")+'</select></label></div>';

  var match=function(e){

/* ---------- work page ---------- */
function workPage(wid){

            {v:facts-(row.stale||0), k:"verified facts", tone:"ok"}, {v:row.stale||0, k:"stale facts", tone:"bad"},

  var pend=(row.pendingItems||[]);
  if(pend.length){
    var g={open:"○",active:"◐",adopted:"◑",done:"✓",dropped:"–"}, tone={open:"wait",active:"live",adopted:"",done:"ok",dropped:""};
    h+='<section class="pending card" style="margin-bottom:36px"><div class="secthead"><span class="label">Pending work</span><span class="n">· '+pend.filter(function(p){return p.status==="open";}).length+' nobody owns</span></div><ul>'+
      pend.map(function(p){ return '<li class="s-'+p.status+'"><span class="g">'+g[p.status]+'</span><div><span class="txt">'+inline(p.subject)+'</span><small><span class="mono">'+esc(p.pid)+'</span>'+chip(p.status,tone[p.status])+' · '+esc(p.source)+(p.reason?' · '+esc(p.reason):'')+'</small></div></li>'; }).join("")+'</ul></section>'; }
  h+='<div class="recordhead"><span class="label">The record</span><span class="n">· '+es.length+' entries from every session</span></div><div class="tabs"></div>';
  es.slice().reverse().filter(function(e){return e.kind!=="brief";}).forEach(function(e){ h+=renderEntry(e,false); });
  return h+'</div>'; }

/* ---------- board ---------- */
function hue(s){ var h=0x811c9dc5; s=String(s||""); for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h%360; }
function initials(n){ var w=String(n||"?").replace(/^session\s+/i,"").split(/[\s_-]+/).filter(Boolean); return (w.length>1? w[0][0]+w[1][0] : (w[0]||"?").slice(0,2)).toUpperCase(); }
function snameId(sid){ var s=B.sessions[sid]; return s? sname(s) : "Session "+String(sid).slice(0,8); }
function av(sid, sm){ return '<span class="av'+(sm?" sm":"")+'" style="--h:'+hue(sid)+'" title="'+esc(snameId(sid))+'">'+esc(initials(snameId(sid)))+'</span>'; }
function sesLink(sid){ return B.sessions[sid]? '<a href="#/s/'+encodeURIComponent(sid)+'" style="color:inherit;text-decoration:none"><b>'+esc(snameId(sid))+'</b></a>' : '<b>'+esc(snameId(sid))+'</b>'; }
function toHtml(to){ return to.filter(function(t){return t!=="board";}).map(function(t){
  if(t==="all") return '<span class="to"><span class="av sm all">∗</span>everyone</span>';
  if(/^W-\d+$/.test(t)) return '<a class="wid" href="#/w/'+t+'" title="Whoever works on '+esc(workPath(t))+'">'+t+'</a>';
  return '<span class="to">'+av(t,true)+esc(snameId(t))+'</span>'; }).join(" "); }
function kb(n){ return n<1024? n+' B' : n<1048576? Math.round(n/1024)+' KB' : (n/1048576).toFixed(1)+' MB'; }
var MKIND={finding:["finding","live"], ask:["asks to investigate","wait"]};
function files(m){ return (m.files||[]).length? '<div class="files">'+m.files.map(function(f){ return '<a href="'+esc(f.path)+'" target="_blank" rel="noopener"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>'+esc(f.name)+'<span>'+kb(f.bytes)+(f.kept<f.bytes?' · last '+kb(f.kept):'')+'</span></a>'; }).join("")+'</div>' : ""; }
function msgMeta(m, arrow){ var to=toHtml(m.to), k=MKIND[m.kind];
  return '<div class="tmeta">'+(k?chip(k[0],k[1]):'')+sesLink(m.sid)+(m.wid?'<a class="wid" href="#/w/'+m.wid+'">'+m.wid+'</a>':'')+(arrow&&to?'<span>→</span>'+to:'')+'<span class="hash">'+esc(m.id.slice(0,7))+'</span><span>'+ago(m.ts)+'</span></div>'; }
function receipts(m){ var r=(m.readBy||[]), want=m.to.filter(function(t){return B.sessions[t];});
  if(!want.length) return r.length? '<div class="rcpt">Seen by '+r.map(snameId).map(esc).join(", ")+'</div>' : "";
  var unread=want.filter(function(t){return r.indexOf(t)<0;});
  return '<div class="rcpt">'+(unread.length? chip("unread by "+unread.map(snameId).join(", "),"wait") : chip("read","ok"))+'</div>'; }
function threadHtml(m, replies, arrow){
  var h='<article class="thread">'+av(m.sid)+'<div>'+msgMeta(m, arrow)+'<h3>'+inline(m.title)+'</h3>'+(m.body?'<div class="md">'+flag(md(m.body))+'</div>':'')+files(m)+(arrow?receipts(m):'');
  if(replies.length) h+='<div class="replies">'+replies.map(function(r){ return '<div class="reply">'+msgMeta(r, false)+'<p class="t">'+inline(r.title)+'</p>'+(r.body?'<div class="md">'+flag(md(r.body))+'</div>':'')+'</div>'; }).join("")+'</div>';
  return h+'</div></article>'; }
function lanesHtml(){ var ls=Object.values(B.lanes||{}).sort(function(a,b){return a.ts-b.ts;});
  if(!ls.length) return '<div class="lanes"><span class="label">Lanes</span><p class="empty">None taken yet. Sessions agree a split on the goal thread, then each takes one.</p></div>';
  return '<div class="lanes"><span class="label">Lanes · who owns which part</span>'+ls.map(function(l){ var s=B.sessions[l.sid];
    return '<div class="lane">'+av(l.sid,true)+'<b>'+esc(l.name)+'</b><span>'+esc(snameId(l.sid))+(s&&stateOf(s)==="finished"?' · ended':'')+'</span>'+(l.scope?'<span class="sc">'+esc(l.scope)+'</span>':'')+'</div>'; }).join("")+'</div>'; }
function directivesHtml(){ var ds=(B.directives||[]).filter(function(d){return d.active;}); if(!ds.length) return "";
  return '<section class="sgoal dirs" aria-label="Directives"><div class="k">Your directives · every session and agent follows these</div><ol>'+ds.map(function(d){ return '<li><span class="md">'+inline(d.text)+'</span><span class="f">'+esc(d.id.slice(0,6))+' · '+ago(d.ts)+'</span></li>'; }).join("")+'</ol><div class="f">Add one by starting a prompt line with <code>@all</code> in any session.</div></section>'; }
function goalHtml(){ var g=B.goal; if(!g||g.status==="cleared") return "";
  var met=g.status==="met", sw=(B.sessions||{}), who=function(id){ return sw[id]? esc(sname(sw[id])) : "session "+esc(String(id).slice(0,8)); };
  return '<section class="sgoal'+(met?" met":"")+'" aria-label="Standing goal"><div class="k">'+(met?"Goal met":"Standing goal from you")+(g.autonomous&&!met?chip("autonomous: sessions keep going","live"):"")+'</div>'+
    '<div class="md">'+md(g.text)+'</div>'+(!met&&g.thread?lanesHtml():'')+'<div class="f">Set '+ago(g.ts)+' via '+who(g.sid)+(met?' · marked met '+ago(g.endTs)+' by '+who(g.endBy)+(g.note?': '+esc(g.note):''):' · every session and agent gets it')+'</div></section>'; }
var draft={to:"all",kind:"fyi",text:""};
function shq(t){ return "'"+String(t).replace(/'/g,"'\\''")+"'"; }
function draftCmd(){ var t=draft.text.trim(); if(!t) return "";
  var first=t.split("\n")[0], rest=t.slice(first.length).trim();
  return (B.cli||"python3 docket.py")+" msg "+shq(draft.to||"all")+" "+shq(first)+(rest?" -b "+shq(rest):"")+(draft.kind!=="fyi"?" --kind "+draft.kind:""); }
function composeHtml(){
  return '<section class="compose" aria-label="Message the sessions"><span class="label">Message the sessions</span>'+
    '<textarea id="dk-text" placeholder="e.g. Freeze merges to main until the SAST gate is green" aria-label="Message">'+esc(draft.text)+'</textarea>'+
    '<div class="row"><input id="dk-to" value="'+esc(draft.to)+'" aria-label="To: all, a session name, or W-xxxx" placeholder="all, a session, W-xxxx">'+
    '<select id="dk-kind" aria-label="Kind"><option value="fyi"'+(draft.kind==="fyi"?" selected":"")+'>FYI</option><option value="ask"'+(draft.kind==="ask"?" selected":"")+'>Ask (they must answer)</option></select>'+
    '<button type="button" id="dk-copy">Copy command</button></div>'+
    '<pre id="dk-cmd">'+(esc(draftCmd())||'Run the copied command in a terminal. It arrives as a message from you, and idle sessions are woken. For rules every session must follow, start a prompt line with @all instead.')+'</pre></section>'; }
function wireCompose(){
  var tx=document.getElementById("dk-text"); if(!tx) return;
  function upd(){ draft.text=tx.value; draft.to=document.getElementById("dk-to").value; draft.kind=document.getElementById("dk-kind").value;
    document.getElementById("dk-cmd").textContent=draftCmd()||"Type a message first."; }
  ["dk-text","dk-to","dk-kind"].forEach(function(id){ document.getElementById(id).addEventListener("input", upd); });
  document.getElementById("dk-copy").addEventListener("click", function(){ var c=draftCmd(), b=this;
    if(!c){ upd(); return; }
    try{ navigator.clipboard.writeText(c).then(function(){ b.textContent="Copied"; setTimeout(function(){ b.textContent="Copy command"; },1500); }); }catch(e){} }); }
function gateHtml(){
  var now=Date.now()/1000, ms=B.metrics||{}, names=Object.keys(ms).sort();
  var lk=Object.values(B.locks||{}).filter(function(l){return l.until>now;});
  var asks=(B.msgs||[]).filter(function(m){ return m.kind==="ask" && !(B.msgs||[]).some(function(r){return r.re===m.id && r.sid!==m.sid;}); });
  if(!names.length && !lk.length && !asks.length) return "";
  var h='<div class="gstat">';
  if(names.length) h+='<div class="box"><span class="label">Gates and metrics · latest</span><ul>'+names.map(function(n){ var r=ms[n][ms[n].length-1], p=ms[n].length>1?ms[n][ms[n].length-2]:null;
    var vals=Object.keys(r.vals).map(function(k){ var v=r.vals[k], pv=p&&p.vals[k]; return k+"="+v+(typeof v==="number"&&typeof pv==="number"&&v!==pv?" ("+(v>pv?"+":"")+Math.round((v-pv)*1000)/1000+")":""); }).join(" ");
    return '<li>'+(r.status?chip(r.status, r.status==="red"?"bad":"ok"):'')+'<b>'+esc(n)+'</b><span class="v">'+esc(vals)+(r.sha?' @'+esc(r.sha.slice(0,9)):'')+'</span><span class="v">'+ago(r.ts)+'</span></li>'; }).join("")+'</ul></div>';
  if(lk.length) h+='<div class="box"><span class="label">Held resources</span><ul>'+lk.map(function(l){ return '<li><b>'+esc(l.name)+'</b><span>'+esc(snameId(l.sid))+'</span><span class="v">until '+new Date(l.until*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+(l.why?' · '+esc(l.why):'')+'</span></li>'; }).join("")+'</ul></div>';
  if(asks.length) h+='<div class="box"><span class="label">Open asks · waiting for an answer</span><ul>'+asks.slice(-8).reverse().map(function(m){ var late=now>(m.due||m.ts+3600);
    return '<li>'+(late?chip("overdue","bad"):chip("open","wait"))+'<span>'+esc(snameId(m.sid))+' → '+toHtml(m.to)+'</span><span class="v">'+esc(m.title.slice(0,90))+'</span></li>'; }).join("")+'</ul></div>';
  return h+'</div>'; }
function boardPage(){
  var all=B.msgs||[], posts=all.filter(function(m){return m.to.indexOf("board")>=0;}), dms=all.filter(function(m){return m.to.indexOf("board")<0;});
  var sy=B.sync, h='<div class="board"><div class="kick"><span class="label">Project board</span></div><h1 class="title">Board</h1>';
  h+=directivesHtml()+goalHtml()+gateHtml()+composeHtml();
  h+='<p class="lede">Notices every session reads, and what sessions told each other. Pinned posts are shown to each new session when it starts.</p>';
  h+='<div class="gitline">'+(sy&&sy.head? '<span class="ref">'+esc(sy.ref)+'</span><span>@ <span class="hash">'+esc(sy.head)+'</span></span><span>'+sy.events+' events in git</span><span>synced '+ago(sy.ts)+(sy.remote?' with '+esc(sy.remote):' (local only)')+'</span>' : '<span class="ref">refs/docket/log</span><span>Not in git yet. It syncs after each turn in a git repo, or run <code>docket.py sync</code>.</span>')+'</div>';
  var boardTab=/^#\/board\/messages/.test(location.hash)?"msgs":"board";
  h+='<nav class="tabs" aria-label="Board views"><a href="#/board"'+(boardTab==="board"?' class="on" aria-current="page"':'')+'>Board · '+posts.filter(function(m){return !m.re;}).length+'</a><a href="#/board/messages"'+(boardTab==="msgs"?' class="on" aria-current="page"':'')+'>Messages · '+dms.length+'</a></nav>';
  function rootsOf(list){ var by={}; list.forEach(function(m){ if(m.re){ (by[m.re]=by[m.re]||[]).push(m);} });
    var roots=list.filter(function(m){return !m.re || !list.some(function(x){return x.id===m.re;});});
    roots.sort(function(a,b){ var la=Math.max.apply(null,[a.ts].concat((by[a.id]||[]).map(function(r){return r.ts;}))), lb=Math.max.apply(null,[b.ts].concat((by[b.id]||[]).map(function(r){return r.ts;}))); return lb-la; });
    return {roots:roots, by:by}; }
  if(boardTab==="board"){
    var pins=posts.filter(function(m){return m.pin&&!m.re;});
    if(pins.length) h+='<div class="pins">'+pins.slice().reverse().map(function(m){ return '<div class="pin"><div class="k"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 7 4 3H6l4-3z"/></svg>Pinned</div><h3>'+inline(m.title)+'</h3>'+(m.body?'<div class="md">'+flag(md(m.body))+'</div>':'')+'<div class="by">'+av(m.sid,true)+esc(snameId(m.sid))+'<span class="hash">'+esc(m.id.slice(0,7))+'</span><span>'+ago(m.ts)+'</span></div></div>'; }).join("")+'</div>';
    var t=rootsOf(posts), rest=t.roots.filter(function(m){return !m.pin||m.re;});
    if(!posts.length) h+='<div class="empty-how">Nothing posted yet. Any session can post a notice for every other session:<pre>docket.py post "Shared box is overloaded" -b "Check load before starting a scan." --pin\ndocket.py reply &lt;id&gt; "Done, my scans have finished"</pre></div>';
    else h+='<div class="glog">'+rest.map(function(m){ return threadHtml(m, t.by[m.id]||[], false); }).join("")+(pins.length&&!rest.length?'<p class="empty">Only pinned posts so far.</p>':'')+'</div>';
  } else {
    var u=rootsOf(dms);
    if(!dms.length) h+='<div class="empty-how">No messages between sessions yet. A session can write to another by name, to everyone on a work item, or to all:<pre>docket.py msg "Gate speed" "Is the test box free?"\ndocket.py msg W-0012 "Baseline moved to 63 after the scorer fix"\ndocket.py msg all "Don\'t run two gates on one box"</pre></div>';
    else h+='<div class="glog">'+u.roots.map(function(m){ return threadHtml(m, u.by[m.id]||[], true); }).join("")+'</div>';
  }
  return h+'</div>'; }

/* ---------- render ---------- */
function route(){ if(/^#\/board/.test(location.hash)) return {v:"board"}; var m=location.hash.match(/^#\/(s|w)\/(.+)$/); if(m) return {v:m[1], id:decodeURIComponent(m[2])}; return {v:"all"}; }
function render(force){
  if(!B) return;
  if(!force && B.updated===lastUpdated){ tick(); return; }
  lastUpdated=B.updated; statCache={};
  var r=route();
  if(r.v==="s" && !B.sessions[r.id]) r={v:"all"};
  if(r.v==="w" && !(B.work||{})[r.id]) r={v:"all"};
  var waiting=Object.values(B.sessions).filter(function(s){return stateOf(s)==="waiting";}).length;
  document.title=(waiting?"("+waiting+") ":"")+(r.v==="s"?sname(B.sessions[r.id])+" · ":"")+B.project+" · Agent Journal";
  rail(r);
  var m=document.getElementById("main"), y=window.scrollY;
  var fo=document.activeElement&&document.activeElement.id, sel=fo==="dk-text"?document.activeElement.selectionStart:null;
  m.innerHTML = r.v==="s"? session(B.sessions[r.id]) : r.v==="w"? workPage(r.id) : r.v==="board"? boardPage() : overview();
  wireCompose();
  if(fo&&/^dk-/.test(fo)&&document.getElementById(fo)){ var el=document.getElementById(fo); el.focus(); if(sel!==null) el.setSelectionRange(sel,sel); }
  if(!force) window.scrollTo(0,y);
  tick(); }
function tick(){ var u=document.getElementById("upd"); if(u&&B) u.textContent=(nowS()*1000-lastSeen<8000?"Record updated ":"Record not refreshing · last ")+ago(B.updated); }

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-open],[data-fold],[data-kind],[data-idx],[data-theme-cycle],[data-copy]"); if(!t) return;
  if(t.hasAttribute("data-copy")){ var code=t.parentNode.querySelector("code").textContent; try{ navigator.clipboard.writeText(code); t.textContent="Copied"; setTimeout(function(){t.textContent="Copy";},1200);}catch(e){} return; }
  if(t.dataset.open){ open[t.dataset.open]=!open[t.dataset.open]; }
  else if(t.dataset.fold){ folded[t.dataset.fold]=!folded[t.dataset.fold]; }
  else if(t.dataset.kind){ kind=t.dataset.kind; }
  else if(t.dataset.idx){ idxMode=t.dataset.idx; }
  else if(t.hasAttribute("data-theme-cycle")){ theme={auto:"light",light:"dark",dark:"auto"}[theme]; try{localStorage.setItem("aj.theme",theme);}catch(e){} applyTheme(); }
  var y=window.scrollY; render(true); window.scrollTo(0,y); });
document.addEventListener("change",function(ev){
  if(ev.target.matches("[data-agent]")){ agentF=ev.target.value; var y=window.scrollY; render(true); window.scrollTo(0,y); }
  if(ev.target.id==="msel"){ location.hash=ev.target.value; } });
window.addEventListener("hashchange",function(){ kind="all"; agentF="all"; render(true); window.scrollTo(0,0); });

/* data.js is re-injected as a <script>; works over file:// where fetch does not */
function load(){
  var s=document.createElement("script");
  s.src="data.js?t="+Date.now();
  s.onload=function(){ s.remove(); if(window.__BOARD__){ B=window.__BOARD__; lastSeen=Date.now(); render(false); } };
  s.onerror=function(){ s.remove(); if(!B) document.getElementById("main").innerHTML='<div class="emptypage"><h2>No record here yet.</h2><p>This page reads <code>data.js</code> next to it. Start a Claude Code session in this folder with the Docket hooks installed.</p></div>'; tick(); };
  document.head.appendChild(s); }
load(); setInterval(load,2000); setInterval(tick,15000);
})();
</script>
